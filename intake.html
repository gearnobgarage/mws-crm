<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Request Service — Murphy Waste Systems</title>
<meta name="theme-color" content="#EFDECD">
<style>
:root{
  --almond:#EFDECD; --almond-2:#F7EFE6; --green:#0B7A52; --green-d:#095F40;
  --brown:#5A4632; --ink:#2A2018; --muted:#7B6A58; --line:#E3D5C4;
  --bg:#FBF7F2; --card:#FFFFFF; --danger:#B3261E;
  --shadow:0 1px 3px rgba(90,70,50,.10),0 8px 24px rgba(90,70,50,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --almond:#2A2119; --almond-2:#241C15; --green:#2BAE7E; --green-d:#1E8C63;
  --brown:#D9C7B2; --ink:#F2E9DE; --muted:#A2917E; --line:#3A2E24;
  --bg:#171210; --card:#211A15; --danger:#F2B8B5;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 20px calc(48px + var(--safe-b))}
header{background:var(--almond);border-bottom:1px solid var(--line);padding:22px 20px}
.hin{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.wm{font-weight:800;font-size:22px;letter-spacing:-.4px;color:var(--green);font-style:italic}
.tag{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  background:var(--green);color:#fff;padding:3px 7px;border-radius:6px}
h1{font-size:25px;letter-spacing:-.5px;margin:26px 0 6px;text-wrap:balance}
.lede{color:var(--muted);font-size:15px;margin-bottom:22px}
label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin:16px 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--ink);font:inherit;font-size:16px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:1px}
textarea{min-height:92px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:430px){.row2{grid-template-columns:1fr}}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
button{display:block;width:100%;margin-top:26px;padding:16px;border:0;border-radius:12px;
  background:var(--green);color:#fff;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
button:active{background:var(--green-d)}
button:disabled{opacity:.6;cursor:default}
.msg{margin-top:14px;padding:12px 14px;border-radius:11px;font-size:14px;display:none}
.msg.err{display:block;background:color-mix(in srgb,var(--danger) 12%,var(--card));
  border:1px solid var(--danger);color:var(--danger)}
.done{display:none;text-align:center;padding:44px 10px}
.done .big{font-size:46px;margin-bottom:14px}
.done h2{font-size:22px;margin-bottom:8px;letter-spacing:-.3px}
.done p{color:var(--muted);font-size:15px}
.done a{display:inline-block;margin-top:22px;color:var(--green);font-weight:700;font-size:16px}
.fine{margin-top:24px;font-size:12.5px;color:var(--muted)}
.call{display:block;margin-top:18px;text-align:center;font-weight:700;color:var(--green);
  text-decoration:none;font-size:15px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------- CONFIG — same two values as the CRM ---------- */
const SUPABASE_URL = "https://rxukrprtoiokvkxhiite.supabase.co";
const SUPABASE_KEY = "sb_publishable_5dj2dgoJticIZ2DTheQ5TA_H0zkMPgV";
/* -------------------------------------------------------- */
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const qs = new URLSearchParams(location.search);

  /* A QR code identifies itself: ?src=qr:truck-12&p=Truck%2012%20decal.
     That is how you find out which sign, truck, or card actually works. */
  const SRC  = qs.get("src") || "web";
  const PAGE = qs.get("p") || document.referrer || "";

  if (SUPABASE_URL.indexOf("PASTE_") === 0) {
    $("#msg").className = "msg err";
    $("#msg").textContent = "This form is not connected yet.";
    $("#go").disabled = true;
    return;
  }
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = (id) => $("#" + id).value.trim();
    if (v("website")) { $("#f").style.display = "none"; $("#done").style.display = "block"; return; }

    const box = $("#msg");
    if (!v("company") && !v("contact")) {
      box.className = "msg err"; box.textContent = "Give us a name to put on the job."; return;
    }
    if (!v("phone") && !v("email")) {
      box.className = "msg err"; box.textContent = "We need a phone number or an email to reply to."; return;
    }
    box.className = "msg"; box.textContent = "";
    $("#go").disabled = true; $("#go").textContent = "Sending…";

    const { error } = await sb.from("inbound_leads").insert({
      company: v("company") || null, contact: v("contact") || null,
      phone: v("phone") || null, email: v("email") || null,
      address: v("address") || null, city: v("city") || null,
      service: v("service") || null, message: v("message") || null,
      source: SRC, page: PAGE ? String(PAGE).slice(0, 300) : null
    });

    if (error) {
      $("#go").disabled = false; $("#go").textContent = "Send it";
      box.className = "msg err";
      box.textContent = "That did not go through. Please call (954) 772-6440 — we do not want to lose your job.";
      return;
    }
    $("#f").style.display = "none";
    $("#done").style.display = "block";
    window.scrollTo(0, 0);
  });
})();
</script>
</body>
</html>
